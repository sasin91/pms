<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Modern clinic reception</title>
  <desc id="desc">A bright clinic interior with a reception desk, seating, plants, and medical symbols.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6fbfa"/>
      <stop offset="1" stop-color="#dcefeb"/>
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="0" y2="1">
