      <stop offset="1" stop-color="#e7f5f5"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdfefe"/>
      <stop offset="1" stop-color="#d7e7e4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#164c4c" flood-opacity=".14"/>
    </filter>
  </defs>

